<?xml version="1.0" encoding="UTF-8"?>
<svg width="47" height="27" viewBox="0 0 47 27" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome switch, off. Faint translucent track, knob in the theme's
       greyed step: nothing here is brighter than the surface it sits on, so an
       off switch stays quiet on the translucent (blurred) panel. -->
  <rect x="0.5" y="0.5" width="46" height="26" rx="13" ry="13"
        fill="#bbbbbb" fill-opacity="0.10"
        stroke="#bbbbbb" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="13.5" cy="13.5" r="10" fill="#7c7c7c"/>
</svg>
