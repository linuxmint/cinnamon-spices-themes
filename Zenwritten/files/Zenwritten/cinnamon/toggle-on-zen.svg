<?xml version="1.0" encoding="UTF-8"?>
<svg width="47" height="27" viewBox="0 0 47 27" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome switch, on. The same track lifted to a translucent #bbbbbb, knob
       to full #bbbbbb: the knob is the brightest thing on the control, which is
       what says "on". No solid fill - the track still lets the blurred panel
       through, so on and off read as the same object in two states. -->
  <rect x="0.5" y="0.5" width="46" height="26" rx="13" ry="13"
        fill="#bbbbbb" fill-opacity="0.34"
        stroke="#bbbbbb" stroke-opacity="0.20" stroke-width="1"/>
  <circle cx="33.5" cy="13.5" r="10" fill="#bbbbbb"/>
</svg>
